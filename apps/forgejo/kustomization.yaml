# Forgejo - self-hosted Git forge (rootless image, Postgres backend).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - external-secret.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - postgres-pvc.yaml
  - forgejo-deployment.yaml
  - forgejo-service.yaml
  - data-pvc.yaml
  - tailscale-ingress.yaml
