# Populates `forgejo-secrets` from Vaultwarden (replaces sealed-secret).
# Item: `k3s/forgejo-secrets`, one Custom Field per key (see SECRETS.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: forgejo-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-name
      remoteRef:
        key: k3s/forgejo-secrets
        property: db-name
    - secretKey: db-user
      remoteRef:
        key: k3s/forgejo-secrets
        property: db-user
    - secretKey: db-password
      remoteRef:
        key: k3s/forgejo-secrets
        property: db-password
