apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-postgres
  namespace: forgejo
  labels:
    app: forgejo-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-postgres
  template:
    metadata:
      labels:
        app: forgejo-postgres
    spec:
      containers:
        - name: postgres
          # 18 needs a fresh cluster: PGDATA points at pg18 so the 17 directory
          # stays in place as the rollback. Dump at /var/lib/postgresql/data/pre18.dump.
          image: docker.io/library/postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: db-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: db-name
            - name: PGDATA
              value: /var/lib/postgresql/data/pg18
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-postgres-pvc
