# Everything the server process needs.
#
# OPENAI_API_KEY / ANTHROPIC_API_KEY are the *gateway* key, not a vendor key:
# every model call goes to the in-cluster LiteLLM, whose only valid credential
# is its master key (there is no key database behind it). The base URLs are not
# secrets, they are composed here because the target Secret is the only thing
# envFrom can project into the server.
#
# OMNIGENT_GITHUB_APP_* is the per-user GitHub connect (Sandbox Integrations ->
# Connect GitHub). The redirect URI must be the public origin — it is what
# GitHub sends the browser back to, and it has to match the App's Callback URL
# character for character. The slug is deliberately absent: it only drives the
# in-product "Install" link, and a wrong slug is worse than none, so it goes in
# once the App's name is confirmed.
#
# OMNIGENT_CREDENTIAL_CIPHER / _VAULT_KEY / VAULT_ADDR / VAULT_TOKEN are the
# credential-store cipher: GitHub App tokens are encrypted at rest, and the only
# two backends are AWS KMS and Vault Transit (no non-KMS fallback, and this lab
# has no AWS account). Vault holds NO application secrets — it is a key service
# for one derived Transit key. The token is least-privilege: policy
# `omnigent-transit` grants encrypt/decrypt/read on `omnigent-credentials` only.
# NOTE: while Vault is sealed (it boots sealed; see `k3s/vault-unseal`) the
# server logs "GitHub App is configured but disabled" and stays dormant rather
# than crashing. Unseal with og-vault/unseal.py, then restart this pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-secrets
  namespace: omnigent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: omnigent-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql+psycopg://omnigent:{{ .POSTGRES_PASSWORD }}@omnigent-postgres:5432/omnigent"
        OMNIGENT_ACCOUNTS_COOKIE_SECRET: "{{ .OMNIGENT_ACCOUNTS_COOKIE_SECRET }}"
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        OPENAI_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        ANTHROPIC_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
        OMNIGENT_GITHUB_APP_CLIENT_ID: "{{ .GITHUB_APP_CLIENT_ID }}"
        OMNIGENT_GITHUB_APP_CLIENT_SECRET: "{{ .GITHUB_APP_CLIENT_SECRET }}"
        OMNIGENT_GITHUB_APP_REDIRECT_URI: "https://omnigent.tail7f3c08.ts.net/v1/connections/github/callback"
        OMNIGENT_CREDENTIAL_CIPHER: "vault"
        OMNIGENT_CREDENTIAL_VAULT_KEY: "{{ .VAULT_KEY }}"
        VAULT_ADDR: "{{ .VAULT_ADDR }}"
        VAULT_TOKEN: "{{ .VAULT_TOKEN }}"
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: k3s/omnigent
        property: POSTGRES_PASSWORD
    - secretKey: OMNIGENT_ACCOUNTS_COOKIE_SECRET
      remoteRef:
        key: k3s/omnigent
        property: OMNIGENT_ACCOUNTS_COOKIE_SECRET
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: k3s/litellm
        property: LITELLM_MASTER_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: k3s/litellm
        property: LITELLM_MASTER_KEY
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: k3s/github-app-omnigent
        property: client-id
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: k3s/github-app-omnigent
        property: client-secret
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: k3s/vault-omnigent-cipher
        property: VAULT_TOKEN
    - secretKey: VAULT_ADDR
      remoteRef:
        key: k3s/vault-omnigent-cipher
        property: VAULT_ADDR
    - secretKey: VAULT_KEY
      remoteRef:
        key: k3s/vault-omnigent-cipher
        property: VAULT_KEY
