# The Omnigent server. The kubernetes-provider image (not the default one): the
# stock server image ships no Kubernetes client, so it cannot launch sandboxes.
#
# The ServiceAccount matters: with the default SA the sandbox launcher gets 403
# on every create in the runner namespace, and the failure surfaces only as
# "Host refused runner launch" in the server log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
  namespace: omnigent
  labels:
    app: omnigent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      labels:
        app: omnigent
      annotations:
        # The server reads its environment once at start and nothing in this
        # cluster watches ConfigMaps or Secrets, so a new value reaches nothing
        # until the pod is replaced. One annotation per source: rebase the
        # checksum on configmap-config.yaml for a config edit, bump the nonce
        # for a Secret edit (a rotated credential, a new redirect URI).
        checksum/omnigent-config: 634f8d4cf1ea8dae0142de4d5f7945ec1c2c880035fd9d08f4664fe80d358056
        omnigent.io/restart-nonce: "2026-10-02T20:53Z"
    spec:
      serviceAccountName: omnigent
      initContainers:
        # The server's entrypoint runs DB migrations and exits if postgres is not
        # accepting yet, so without this a from-scratch deploy costs one
        # CrashLoop-restart cycle before it comes up. Pod restarts hide it; a
        # clean install should not need them.
        - name: wait-for-postgres
          image: docker.io/library/postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h omnigent-postgres -p 5432 -U omnigent -d omnigent; do echo waiting for postgres; sleep 2; done
      containers:
        - name: omnigent
          # Upstream publishes this image as a rolling tag; pinning a digest here
          # would fight the project's release cadence, so this is the one place a
          # mutable tag is tolerated. Roll a restart after a pull to use it.
          image: ghcr.io/omnigent-ai/omnigent-server-kubernetes:latest
          imagePullPolicy: Always
          env:
            - name: OMNIGENT_CONFIG
              value: /data/server-config.yaml
          envFrom:
            - configMapRef:
                name: omnigent-config
            - secretRef:
                name: omnigent-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            limits: { memory: 2Gi }
            requests: { cpu: 250m, memory: 512Mi }
          volumeMounts:
            - name: server-config
              mountPath: /data/server-config.yaml
              subPath: config.yaml
              readOnly: true
            - name: artifacts
              mountPath: /data/artifacts
      volumes:
        - name: server-config
          configMap:
            name: omnigent-server-config
        - name: artifacts
          persistentVolumeClaim:
            claimName: omnigent-artifacts
