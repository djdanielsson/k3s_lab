# The Omnigent server. The kubernetes-provider image (not the default one): the
# stock server image ships no Kubernetes client, so it cannot launch sandboxes.
#
# The ServiceAccount matters: with the default SA the sandbox launcher gets 403
# on every create in the runner namespace, and the failure surfaces only as
# "Host refused runner launch" in the server log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
  namespace: omnigent
  labels:
    app: omnigent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      labels:
        app: omnigent
      annotations:
        # The server reads its environment once at start and nothing in this
        # cluster watches ConfigMaps or Secrets, so a new value reaches nothing
        # until the pod is replaced. One annotation per source: rebase the
        # checksum on configmap-config.yaml for a config edit, bump the nonce
        # for a Secret edit (a rotated credential, a new redirect URI).
        checksum/omnigent-config: 634f8d4cf1ea8dae0142de4d5f7945ec1c2c880035fd9d08f4664fe80d358056
        # sha256 of configmap-server-config.yaml. That file holds the provider
        # blocks and harness bindings, so an inference change has to roll the
        # pod too — a mounted ConfigMap updates on disk but the server parses
        # it once at boot.
        checksum/omnigent-server-config: 9c7cb664030cd5c1c462343ab350b6e472e3d0d0d79e9405ff8790cf47ac85ff
        omnigent.io/restart-nonce: "2026-10-22T15:10Z"
    spec:
      serviceAccountName: omnigent
      initContainers:
        # The server's entrypoint runs DB migrations and exits if postgres is not
        # accepting yet, so without this a from-scratch deploy costs one
        # CrashLoop-restart cycle before it comes up. Pod restarts hide it; a
        # clean install should not need them.
        - name: wait-for-postgres
          image: docker.io/library/postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h omnigent-postgres -p 5432 -U omnigent -d omnigent; do echo waiting for postgres; sleep 2; done
      containers:
        - name: omnigent
          # PINNED, not rolling. Upstream's `:latest` currently resolves to the
          # same digest as v0.16.0 (verified against ghcr), but a mutable tag
          # means the running server can change under a restarted pod with no
          # commit to point at — the one thing this repo's convention forbids
          # elsewhere. Bump deliberately, and record the digest when you do.
          #
          # CUSTOM BUILD: this is our own image, built in-cluster from the pinned
          # upstream base with one patch (`harness_labels` gains an
          # `opencode-native` row) plus `hvac` for the Vault credential cipher.
          # Dockerfile + build job: k8s_lab/apps/omnigent/image/. Pinned TAG, not
          # `:latest`: the tag is the rollback handle, and the digest is the
          # proof of what actually ran. v0.19.0 image digest:
          # sha256:6a9a4a5eaf06…; the previous v0.16.0 image was
          # sha256:60f7ca5db45a… (still in the registry for rollback).
          #
          # Caveat: the picker row alone does NOT make an opencode session run.
          # The runner must also advertise and dispatch the harness — that half
          # lives in the host image (Dockerfile.omnigent-host-opencode), which
          # adds `opencode-native` to the tunnel hello frame and injects the
          # OpenCode Go session headers. Both halves are required.
          # v0.19.0-sub1 adds the subscription-provider patch: upstream refuses
          # any provider kind except gateway/key/local for managed inference and
          # calls _wire() (which needs a family table) before reading
          # model_allowlist, so the Codex ChatGPT lane could never appear in the
          # composer. Image digest: sha256:6068ce324804…
          image: registry.registry.svc:5000/omnigent-server-opencode:v0.19.0-sub1
          imagePullPolicy: Always
          env:
            - name: OMNIGENT_CONFIG
              value: /data/server-config.yaml
          envFrom:
            - configMapRef:
                name: omnigent-config
            - secretRef:
                name: omnigent-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            limits: { memory: 2Gi }
            requests: { cpu: 250m, memory: 512Mi }
          volumeMounts:
            - name: server-config
              mountPath: /data/server-config.yaml
              subPath: config.yaml
              readOnly: true
            - name: artifacts
              mountPath: /data/artifacts
      volumes:
        - name: server-config
          configMap:
            name: omnigent-server-config
        - name: artifacts
          persistentVolumeClaim:
            claimName: omnigent-artifacts
