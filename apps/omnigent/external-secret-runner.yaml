# The environment every runner Pod gets, and therefore what the agent harness
# inside it resolves its model credential from — the server config's
# `api_key_ref: env:OPENAI_API_KEY` is read here.
#
# Only the OpenAI family is configured on purpose: LiteLLM's Anthropic surface
# translates tool_use/tool_result into OpenAI shape for the deepseek upstream,
# and drops the tool outputs when an assistant turn carries text alongside its
# tool calls (which is every Pi turn). Pi therefore speaks the OpenAI wire
# natively and this Secret carries no Anthropic credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-runner-llm
  namespace: omnigent-sandboxes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: omnigent-runner-llm
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        OPENAI_BASE_URL: "http://agentforge-llm.agentforge.svc.cluster.local:4000/v1"
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: k3s/litellm
        property: LITELLM_MASTER_KEY
