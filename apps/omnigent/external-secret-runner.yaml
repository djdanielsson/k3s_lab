# The environment every runner Pod gets, and therefore what the agent harness
# inside it resolves its model credential from — the server config's
# `api_key_ref: env:OPENCODE_GO_API_KEY` is read here.
#
# The OpenAI lane carries NO credential: codex-native authenticates with Codex's
# own ChatGPT login, bridged out of $CODEX_HOME (a personal Plus/Pro plan has no
# headless token). CODEX_HOME is a plain path, not a secret, but it has to reach
# the host container's environment, and this is the only env the sandbox
# launcher projects — so it rides here as a literal.
#
# Only the OpenAI family is configured on purpose: Pi is no longer deployed (no
# ChatGPT-subscription lane, and the Go upstream needs an x-opencode-session
# header Pi does not send), so this Secret carries no Anthropic credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-runner-llm
  namespace: omnigent-sandboxes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: omnigent-runner-llm
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The persistent Codex home (PVC omnigent-codex-home, see
        # pvc-codex-home.yaml). Codex refreshes its OAuth tokens in place here.
        CODEX_HOME: "/mnt/codex-home"
        # Direct OpenCode Go credential for the opencode-native lane. The
        # provider block in the server config reads exactly this name, and
        # the harness's synthesized opencode.json carries it as a bearer
        # token in the per-session XDG config (0600), never in a shared file.
        OPENCODE_GO_API_KEY: "{{ .OPENCODE_GO_API_KEY }}"
  data:
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: k3s/litellm
        property: OPENCODE_GO_API_KEY
