# The postgres superuser password, generated into Vaultwarden by hand (one-off
# `bw generate`) and consumed here. The server never sees this directly: it gets
# it composed into DATABASE_URL by external-secret-omnigent.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-pg
  namespace: omnigent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: omnigent-pg
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: k3s/omnigent
        property: POSTGRES_PASSWORD
