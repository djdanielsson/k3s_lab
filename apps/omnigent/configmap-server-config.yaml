# The server config, mounted at /data/server-config.yaml and pointed at by
# OMNIGENT_CONFIG. Three things in here were established the hard way; they are
# load-bearing, not stylistic:
#
#   1. `provider: kubernetes` with a runner namespace and a credentials Secret
#      name, rather than the (also supported) OpenShell provider. OpenShell's
#      Kubernetes sandbox runtime publishes a synthetic DNS view to the sandbox
#      and needs an upgraded, incompatible gateway to do it, so the host's
#      websocket tunnel to the server never connected. Plain runner Pods have
#      ordinary cluster networking and connect on the first try.
#   2. Each provider family lane needs `models.default`. Pi's credential
#      resolver silently drops a family whose default model is unset, then
#      "Pi will use its own login" and 401s against whatever it defaults to.
#   3. There is no `anthropic` lane on purpose (see external-secret-runner.yaml).
#      `default:` names the families the provider serves, not harnesses, and the
#      key must be `api_key_ref` — the server rejects an inline `api_key:`.
#   4. `kubernetes.image` is the custom host image (Dockerfile.omnigent-host-opencode
#      in the registry Namespace's build context). It exists for one reason: the
#      official `omnigent-host` image ships claude / codex / pi / kiro-cli / agy
#      and NO opencode binary, so a session that resolves to `opencode-native`
#      could never launch — the harness would fail on a missing CLI. The custom
#      image is `FROM ghcr.io/omnigent-ai/omnigent-host` plus upstream's own
#      install-harness-cli.sh row for opencode, nothing else, so it tracks the
#      official image except for the added CLI. Remove this key to fall back.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-server-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: kubernetes
      server_url: http://omnigent.omnigent.svc.cluster.local
      kubernetes:
        namespace: omnigent-sandboxes
        secret_name: omnigent-runner-llm
        image: registry.registry.svc:5000/omnigent-host-opencode:latest
      # Server-side model discovery for the host_config provider: without it a
      # session create fails with "Configure sandbox.model_discovery for this
      # provider or a model_allowlist for this harness" — the gateway's model
      # list is resolved HERE, by the server, rather than in the sandbox.
      # `openai` is the family for any OpenAI-compatible gateway (the same
      # family the provider block above serves); the credential is a reference,
      # never a value.
      model_discovery:
        litellm:
          base_url: http://litellm.litellm.svc.cluster.local:4000/v1
          api_key_ref: env:OPENAI_API_KEY
          family: openai
      host_config:
        providers:
          litellm:
            kind: gateway
            default: [openai]
            openai:
              base_url: http://litellm.litellm.svc.cluster.local:4000/v1
              api_key_ref: env:OPENAI_API_KEY
              wire_api: chat
              models:
                default: smart
        inference:
          harnesses:
            pi:
              provider: litellm
              default_model: smart
            codex-native:
              provider: litellm
              default_model: smart
            opencode-native:
              provider: litellm
              default_model: smart
