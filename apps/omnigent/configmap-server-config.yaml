# The server config, mounted at /data/server-config.yaml and pointed at by
# OMNIGENT_CONFIG. Four things in here were established the hard way; they are
# load-bearing, not stylistic:
#
#   1. `provider: kubernetes` with a runner namespace and a credentials Secret
#      name, rather than the (also supported) OpenShell provider. OpenShell's
#      Kubernetes sandbox runtime publishes a synthetic DNS view to the sandbox
#      and needs an upgraded, incompatible gateway to do it, so the host's
#      websocket tunnel to the server never connected. Plain runner Pods have
#      ordinary cluster networking and connect on the first try.
#
#   2. `kubernetes.image` is the custom host image (Dockerfile.omnigent-host-opencode
#      in the registry Namespace's build context). It exists for one reason: the
#      official `omnigent-host` image ships claude / codex / pi / kiro-cli / agy
#      and NO opencode binary, so a session that resolves to `opencode-native`
#      could never launch — the harness would fail on a missing CLI. The custom
#      image is `FROM ghcr.io/omnigent-ai/omnigent-host` plus upstream's own
#      install-harness-cli.sh row for opencode, nothing else, so it tracks the
#      official image except for the added CLI. Remove this key to fall back.
#
#   3. Two lanes, two authentications, no gateway in between:
#
#      - `opencode-native` → `opencode-go`, the flat-rate Go subscription at
#        https://opencode.ai/zen/go/v1. Go requires a stable
#        `x-opencode-session` header and a real client UA on chat completions;
#        the host image injects both per session and advertises the harness in
#        its tunnel hello frame. Without those two patches a direct lane 400s
#        and the harness is never offered to a managed sandbox.
#
#      - `codex-native` → `codex-sub`, a `kind: subscription` provider, i.e.
#        Codex's own ChatGPT login. There is no API key anywhere: a personal
#        Plus/Pro plan has no headless token, and Codex stores its session in
#        `$CODEX_HOME/auth.json` with rotating single-use refresh tokens.
#        `sandbox.kubernetes.pvc_mounts` therefore backs CODEX_HOME with a
#        claim (omnigent-codex-home) and the runner Secret sets
#        `CODEX_HOME=/mnt/codex-home`, so refreshes land on storage that
#        outlives the 7-day sandbox Job. A read-only Secret copy of auth.json
#        would work exactly once and then go stale.
#
#      Pi is deliberately absent: it has no ChatGPT-subscription lane (a codex
#      subscription cannot drive it) and the Go upstream needs headers Pi does
#      not send. Its old binding pointed at the LiteLLM gateway, which is gone.
#
#   4. There is no `anthropic` lane on purpose (see external-secret-runner.yaml).
#      `default:` names the families a provider serves, not harnesses, and a key
#      must be `api_key_ref` — the server rejects an inline `api_key:`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-server-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: kubernetes
      server_url: http://omnigent.omnigent.svc.cluster.local
      kubernetes:
        namespace: omnigent-sandboxes
        secret_name: omnigent-runner-llm
        image: registry.registry.svc:5000/omnigent-host-opencode:latest
        # One shared, persistent CODEX_HOME. `/home/omnigent` is a reserved
        # mount prefix in the provider's validation, so the claim cannot be
        # mounted over the runner's HOME; CODEX_HOME points at /mnt instead.
        pvc_mounts:
          - claim_name: omnigent-codex-home
            mount_path: /mnt/codex-home
            read_only: false
      # Server-side model discovery for a gateway provider: without it a session
      # create fails with "Configure sandbox.model_discovery for this provider or
      # a model_allowlist for this harness" — the catalog is resolved HERE, by
      # the server, rather than in the sandbox. `/models` on Go does NOT need the
      # x-opencode-session header (only chat completions do), so the server can
      # enumerate it with just the bearer key. A subscription provider needs no
      # entry: codex-native probes its own CLI for the account's catalog.
      model_discovery:
        opencode-go:
          base_url: https://opencode.ai/zen/go/v1
          api_key_ref: env:OPENCODE_GO_API_KEY
          family: openai
      host_config:
        providers:
          # Codex's own ChatGPT login. `cli: codex` is what tells the resolver
          # this provider serves the openai family without carrying any
          # credential of its own: the login lives in $CODEX_HOME.
          codex-sub:
            kind: subscription
            cli: codex
            default: [openai]
          # Direct OpenCode Go. No `default:` on purpose: codex-sub keeps the
          # openai-family default (two defaults on one family is a validation
          # error), and this provider is reached only through the explicit
          # opencode-native binding below. Go needs wire_api chat — the
          # opencode harness rejects a Responses endpoint.
          opencode-go:
            kind: gateway
            openai:
              base_url: https://opencode.ai/zen/go/v1
              api_key_ref: env:OPENCODE_GO_API_KEY
              wire_api: chat
              models:
                default: deepseek-v4.1-flash
        inference:
          harnesses:
            codex-native:
              provider: codex-sub
            # `model_allowlist` is also what opencode's in-session model picker
            # lists, so it is the knob that decides how much of Go's catalog is
            # reachable.
            opencode-native:
              provider: opencode-go
              default_model: deepseek-v4.1-flash
              model_allowlist:
                - deepseek-v4.1-flash
                - deepseek-v4-flash
