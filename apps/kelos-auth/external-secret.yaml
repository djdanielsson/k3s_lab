# Populates `kelos-console-auth` from Vaultwarden (replaces sealed-secret).
# Item: `k3s/kelos-console`, Custom Field `token` (see SECRETS.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kelos-console-auth
  namespace: kelos-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: kelos-console-auth
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: k3s/kelos-console
        property: token
