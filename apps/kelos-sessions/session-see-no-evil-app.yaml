# Session: see-no-evil-app (PRIVATE, opencode-go/deepseek-v4-flash)
apiVersion: kelos.dev/v1alpha2
kind: Session
metadata:
  name: see-no-evil-app
  namespace: kelos
  labels:
    app.kubernetes.io/part-of: kelos
    kelos.dev/repo: see-no-evil-app
spec:
  initialPrompt: |
    Ready to work on see-no-evil-app. Ask what you should do or give me a task.
  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  worker:
    type: opencode
    model: opencode-go/deepseek-v4-flash
    credentials:
      type: api-key
      secretRef:
        name: opencode-credentials
    workspaceRef:
      name: workspace-see-no-evil-app
