# Interactive opencode Session pinned to muse-spark-1.3-contributor
# (paid tier on the opencode-go provider, same key as deepseek session).
# No Workspace is pre-wired: connect and give it a repo URL to clone.
apiVersion: kelos.dev/v1alpha2
kind: Session
metadata:
  name: muse-spark-1-3
  namespace: kelos
  labels:
    app.kubernetes.io/part-of: kelos
spec:
  initialPrompt: |
    What would you like to work on? Give me a git repository URL to clone
    and I'll get started.
  # 10Gi durable workspace; default storage class (local-path).
  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  worker:
    type: opencode
    model: opencode-go/muse-spark-1.3-contributor
    credentials:
      type: api-key
      secretRef:
        name: opencode-credentials
