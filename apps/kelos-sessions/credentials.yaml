# Populates `opencode-credentials` from Vaultwarden for Kelos opencode
# sessions. Reuses the hermes-env item's OPENCODE_GO_API_KEY field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-credentials
  namespace: kelos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: opencode-credentials
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: k3s/hermes-env
        property: OPENCODE_GO_API_KEY
