# Preconfigured Kelos opencode Sessions (models pinned, durable workspaces,
# creds from Vaultwarden) + the kelos namespace they live in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kelos
resources:
  - namespace.yaml
  - credentials.yaml
  - session-deepseek.yaml
  - session-muse-spark.yaml
