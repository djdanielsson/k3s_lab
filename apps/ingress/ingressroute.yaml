# LAB INGRESS — Traefik IngressRoutes (all DISABLED)
# -------------------------------------------------------------------------------
# Central place for every app's Traefik IngressRoute. Everything below is
# COMMENTS. Enabling ingress for ALL apps at once:
#
#   1) Uncomment this whole file (4 IngressRoute docs).
#   2) In this dir's kustomization.yaml, uncomment the  - ingressroute.yaml
#      resource entry.
#   3) In ../infra/argocd-apps/, uncomment application-ingress.yaml AND its
#      line in kustomization.yaml.
#   4) kubectl apply -k .   (ArgoCD then manages them)
#
# Prereq: Traefik controller running + host CNI pod-to-pod networking fixed.
# DNS: point these hosts at 192.168.1.116.
#   registry.k3s.lab.danielsson.us.com
#   pantrywise.k3s.lab.danielsson.us.com
#   rustfs.k3s.lab.danielsson.us.com     (web console; S3 stays on :9000)
#   radar.k3s.lab.danielsson.us.com
# ═══════════════════════════════════════════════════════════════════════════════
