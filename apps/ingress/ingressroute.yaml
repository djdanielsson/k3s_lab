# Traefik IngressRoutes for the lab apps.
# DNS: point each host below at 192.168.1.116.
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: registry
  namespace: registry
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`registry.k3s.lab.danielsson.us.com`)
      services:
        - name: registry
          port: 5000
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: pantrywise
  namespace: pantrywise
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`pantrywise.k3s.lab.danielsson.us.com`)
      services:
        - name: web
          port: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`rustfs.k3s.lab.danielsson.us.com`)
      services:
        - name: rustfs
          port: 9001
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: radar
  namespace: radar
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`radar.k3s.lab.danielsson.us.com`)
      services:
        - name: radar
          port: 9280
