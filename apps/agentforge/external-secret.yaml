# Cluster-side wiring for AgentForge: the Secret the chart's model gateway reads.
#
# Kept here rather than in the chart so the chart stays installable anywhere,
# and here rather than in the agentforge Application because that one tracks the
# application repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentforge-llm
  namespace: agentforge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: agentforge-llm
    creationPolicy: Owner
  data:
    # What agents and the dashboard authenticate to the gateway with.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: k3s/litellm
        property: LITELLM_MASTER_KEY
    # One field per cloud alias. An empty field in Vaultwarden means the alias
    # that names it fails authentication, which is the honest failure: the alias
    # exists, the provider was simply never paid for.
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: k3s/litellm
        property: OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: k3s/litellm
        property: ANTHROPIC_API_KEY
    # For an OpenAI-compatible endpoint elsewhere on the LAN, if it needs a key.
    - secretKey: LAN_LLM_API_KEY
      remoteRef:
        key: k3s/litellm
        property: LAN_LLM_API_KEY
