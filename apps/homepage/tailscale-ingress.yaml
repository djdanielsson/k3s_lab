# The lab's single entry point: homepage.tail7f3c08.ts.net
#
# spec.tls[0].hosts[0] is what sets the MagicDNS name - the operator takes the
# first label of that host as the device name (the Ingress object's own name is
# only used when TLS is absent). Keep it a bare <name>.tail7f3c08.ts.net.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ts
  namespace: homepage
  labels:
    app.kubernetes.io/instance: tailscale-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - homepage.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: homepage
      port:
        number: 80
