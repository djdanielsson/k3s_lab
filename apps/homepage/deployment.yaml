# Homepage - the lab dashboard (ghcr.io/gethomepage/homepage).
#
# Tiles are not declared here: the app lists Ingresses cluster-wide and renders
# one tile per Ingress annotated gethomepage.dev/enabled. See
# apps/tailscale-ingress/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image ships a prerendered page built from its skeleton config and
        # /app belongs to root, so copy the build into a writable volume for the
        # non-root process to regenerate in place.
        - name: page-cache
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          command:
            - sh
            - -c
            - cp -R /app/.next/. /cache/
          volumeMounts:
            - name: page-cache
              mountPath: /cache
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.tail7f3c08.ts.net
            - name: HOMEPAGE_AUTH_ENABLED
              value: "true"
            - name: HOMEPAGE_EXTERNAL_URL
              value: https://homepage.tail7f3c08.ts.net
            - name: HOMEPAGE_AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: sso-oidc, key: auth-secret}
            - name: HOMEPAGE_OIDC_ISSUER
              value: https://sso.tail7f3c08.ts.net/realms/lab
            - name: HOMEPAGE_OIDC_CLIENT_ID
              value: homepage
            - name: HOMEPAGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-oidc, key: client-secret}
            - name: HOMEPAGE_OIDC_NAME
              value: Lab SSO
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 3000
          # v2.8 renders authenticated pages through getServerSideProps;
          # the former anonymous /api/revalidate startup hook is unnecessary.
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/config/logs
            - name: page-cache
              mountPath: /app/.next
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: homepage-config
        - name: logs
          emptyDir: {}
        - name: page-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
