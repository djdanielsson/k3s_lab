# Only services that cannot be discovered from an Ingress belong here.
# Everything else is built from gethomepage.dev/* annotations on the
# ingressClassName: tailscale Ingresses in each app directory.
#
# The apps below run on the NAS (192.168.2.82), not in this cluster, so they
# have no Ingress to be discovered from. Ports were found by scanning the host;
# these are its LAN addresses, which also work over the tailnet because
# truenas-scale advertises 192.168.2.0/24 as a subnet route.
