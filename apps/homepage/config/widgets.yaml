- greeting:
    text: k3s.lab
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
# The kubernetes widget renders `cluster.show` and `nodes.show`, so both keys
# must exist even when one is hidden.
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: Cluster
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: Node
