# Tailscale operator - exposes Services on your tailnet (*.ts.net) over WireGuard.
# Kept alongside Traefik, which stays for local-LAN access.
#
# NOTE: nothing deploys this directory. The operator comes from the
# `tailscale-operator` Application, which sources the upstream Helm chart
# directly from github.com/tailscale/tailscale (see
# infra/argocd-apps/application-tailscale-operator.yaml). The `tailscale`
# namespace it declares already exists, so re-applying it is a no-op if that
# app is ever pointed here. The operator's OAuth credential lives in
# apps/tailscale-oauth.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
