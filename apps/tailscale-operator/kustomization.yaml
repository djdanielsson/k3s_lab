# Tailscale operator - exposes Services on your tailnet (*.ts.net) over WireGuard.
# Kept alongside Traefik, which stays for local-LAN access.
#
# NOTE: the operator Helm chart itself is not installed yet (its chart endpoint
# 404'd from our sandbox). This dir currently holds:
#   - namespace.yaml            (tailscale ns)
#   - sealed-secret.yaml        (SealedSecret for the OAuth client creds)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sealed-secret.yaml
