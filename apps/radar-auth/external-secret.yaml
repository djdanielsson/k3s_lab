# Populates `radar-argocd-token` from Vaultwarden (replaces sealed-secret).
# Item: `k3s/radar-auth`, Custom Field `token` (see SECRETS.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-argocd-token
  namespace: radar
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: radar-argocd-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: k3s/radar-auth
        property: token
