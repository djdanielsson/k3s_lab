# NodePort for the dnsmasq web UI (DNS itself is on hostNetwork :53).
apiVersion: v1
kind: Service
metadata:
  name: dnsmasq
  namespace: dnsmasq
  labels:
    app: dnsmasq
spec:
  type: NodePort
  selector:
    app: dnsmasq
  ports:
    - name: web
      port: 5380
      targetPort: 5380
      nodePort: 30880
