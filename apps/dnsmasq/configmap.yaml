apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsmasq-config
  namespace: dnsmasq
data:
  dnsmasq.conf: |
    # Resolve all *.k3s.lab.danielsson.us.com to the k3s node.
    address=/k3s.lab.danielsson.us.com/192.168.1.116
    # Forward everything else to public resolvers.
    server=1.1.1.1
    server=8.8.8.8
    # Bind only the LAN address (plus bind-interfaces so we DON'T take lo:53 from
    # systemd-resolved, which would fail with "Address in use").
    no-resolv
    bind-interfaces
    listen-address=192.168.1.116
