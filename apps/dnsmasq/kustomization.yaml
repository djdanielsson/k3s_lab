# dnsmasq - LAN DNS resolver.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  # Cluster CoreDNS overrides (k3s coredns-custom): records for names that only
  # exist in tailnet MagicDNS, e.g. Vault's OIDC issuer.
  - coredns-custom.yaml
