# Expose the Hermes dashboard + OpenAI API over the Tailscale tailnet.
# spec.tls[0].hosts[0] sets the MagicDNS names: hermes / hermes-api.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard-ts
  namespace: hermes
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Hermes
    gethomepage.dev/group: Agents
    gethomepage.dev/icon: mdi-robot-happy
    gethomepage.dev/description: Agent dashboard (basic auth)
    gethomepage.dev/href: https://hermes.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: hermes
      port:
        number: 9119
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-api-ts
  namespace: hermes
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Hermes API
    gethomepage.dev/group: Agents
    gethomepage.dev/icon: mdi-api
    gethomepage.dev/description: OpenAI-compatible API endpoint
    gethomepage.dev/href: https://hermes-api.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes-api.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: hermes
      port:
        number: 8642
