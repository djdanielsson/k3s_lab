# Populates the `hermes-env` Secret (-> deployment envFrom) from Vaultwarden.
# Item: `k3s/hermes-env`, one Custom Field per key (see SECRETS.md).
# Uses the shared bitwarden-fields ClusterSecretStore from apps/eso-bitwarden.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hermes-env
  namespace: hermes
  labels:
    app: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: hermes-env
    creationPolicy: Owner
  data:
    # LLM provider key for the opencode-go gateway (rewrite `provider` in
    # configmap.yaml if you switch providers).
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: k3s/hermes-env
        property: OPENCODE_GO_API_KEY
    # Secret guarding the OpenAI-compatible API server (min 8 chars).
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: k3s/hermes-env
        property: API_SERVER_KEY
    # Dashboard basic-auth provider (required for a non-loopback dashboard bind).
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: k3s/hermes-env
        property: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: k3s/hermes-env
        property: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: k3s/hermes-env
        property: HERMES_DASHBOARD_BASIC_AUTH_SECRET
    # Telegram (only if platforms.telegram.enabled: true in configmap.yaml).
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: k3s/hermes-env
        property: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: k3s/hermes-env
        property: TELEGRAM_ALLOWED_USERS
    - secretKey: TELEGRAM_HOME_CHANNEL
      remoteRef:
        key: k3s/hermes-env
        property: TELEGRAM_HOME_CHANNEL