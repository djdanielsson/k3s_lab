apiVersion: v1
kind: Service
metadata:
  name: hermes-api-auth
  namespace: hermes
spec:
  selector:
    app: hermes-api-auth
  ports:
  - name: http
    port: 4180
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-api-auth
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-api-auth
  template:
    metadata:
      labels:
        app: hermes-api-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
        args:
        - --alpha-config=/etc/oauth2-proxy/oauth2-proxy.yaml
        - --redirect-url=https://hermes-api.tail7f3c08.ts.net/oauth2/callback
        - --email-domain=*
        - --reverse-proxy=true
        - --skip-jwt-bearer-tokens=true
        - --api-route=^/
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --cookie-name=hermes_api_sso
        - --cookie-refresh=5m
        - --cookie-expire=1h
        - --skip-provider-button=true
        - --request-logging=false
        - --bearer-token-login-fallback=false
        - --force-json-errors=true
        env:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sso-oidc
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: sso-oidc
              key: cookie-secret
        - name: HERMES_UPSTREAM_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-env
              key: API_SERVER_KEY
        - name: HERMES_UPSTREAM_AUTHORIZATION
          value: Bearer $(HERMES_UPSTREAM_KEY)
        ports:
        - name: http
          containerPort: 4180
        volumeMounts:
        - name: config
          mountPath: /etc/oauth2-proxy
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
      volumes:
      - name: config
        configMap:
          name: hermes-api-auth
