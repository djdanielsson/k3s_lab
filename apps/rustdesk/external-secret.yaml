# Server identity for clients. Item `k3s/rustdesk` (see SECRETS.md).
#
# `public-key` is the value users paste into the RustDesk client's "Key" field;
# `private-key` is what hbbs signs with. Both come from the live PVC, so a
# rebuilt volume restores the SAME identity instead of minting a new key that
# would un-enrol every client.
#
# creationPolicy: Owner means deleting this ExternalSecret garbage-collects the
# Secret. The PVC copy is the runtime source; this Secret only re-seeds it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustdesk-keys
  namespace: rustdesk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: rustdesk-keys
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: k3s/rustdesk
        property: private-key
    - secretKey: id_ed25519.pub
      remoteRef:
        key: k3s/rustdesk
        property: public-key
