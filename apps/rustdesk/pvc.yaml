apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustdesk-data
  namespace: rustdesk
  annotations:
    # Holds the server identity (id_ed25519 / id_ed25519.pub) and the peer
    # database. Pruning it changes the key and un-enrols every client.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: rustdesk
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
