# bitwarden-cli sidecar — Vaultwarden API bridge for ESO's webhook provider.
# hostNetwork so it reaches Vaultwarden over the node's Tailscale (truenas-scale)
# without needing cluster networking routes to the tailnet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-cli
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: bitwarden-cli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitwarden-cli
    spec:
      hostNetwork: true
      hostAliases:
        - ip: "100.126.222.105"
          hostnames:
            - "truenas-scale"
      containers:
        - name: bitwarden-cli
          image: ghcr.io/morey-tech/bitwarden-cli:2025.12.1
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: BW_HOST
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_HOST }
            - name: BW_CLIENTID
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_CLIENTID }
            - name: BW_CLIENTSECRET
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_CLIENTSECRET }
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_PASSWORD }
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
