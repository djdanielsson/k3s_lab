# bitwarden-cli sidecar — Vaultwarden API bridge for ESO's webhook provider.
# hostNetwork so it reaches Vaultwarden over the node's Tailscale (truenas-scale)
# without needing cluster networking routes to the tailnet.
#
# The image is pinned deliberately; Renovate is told to leave it alone (see
# renovate.json). From 2026.x on the bundled CLI breaks this bridge in two ways,
# both of which fail *silently* as far as the cluster is concerned:
#
#   1. `bw serve --hostname <addr>` also builds a Host allowlist from that value,
#      so the image's own entrypoint (`--hostname 0.0.0.0`) answers
#      `403 Forbidden — Blocking request with disallowed Host` to every request
#      arriving through the Service's DNS name.
#   2. `bw serve` dies (wasm trap) on reads whose search term arrives
#      URL-encoded, which is what an ESO webhook remoteRef containing a slash
#      sends: `k3s/litellm` → `search=k3s%2Flitellm`.
#
# Either one shows up only as `SecretSyncedError: could not get secret data from
# provider` on every ExternalSecret — and because ESO keeps the last good
# Secret, nothing visibly breaks until something needs a refresh. 2025.12.1
# serves both forms, so this pin is what keeps the cluster's secrets syncing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-cli
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: bitwarden-cli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitwarden-cli
    spec:
      hostNetwork: true
      hostAliases:
        - ip: "100.126.222.105"
          hostnames:
            - "truenas-scale"
      containers:
        - name: bitwarden-cli
          image: ghcr.io/morey-tech/bitwarden-cli:2025.12.1
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: BW_HOST
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_HOST }
            - name: BW_CLIENTID
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_CLIENTID }
            - name: BW_CLIENTSECRET
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_CLIENTSECRET }
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef: { name: bitwarden-cli, key: BW_PASSWORD }
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
