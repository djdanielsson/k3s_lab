apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-ts
  namespace: rustfs
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: RustFS
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: rustfs.png
    gethomepage.dev/description: S3 object storage console
    gethomepage.dev/href: https://rustfs.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - rustfs.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: rustfs
      port:
        number: 9001
