apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-sso-bootstrap
  namespace: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: vault-sso-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: token
    remoteRef:
      key: k3s/vault-sso
      property: token
