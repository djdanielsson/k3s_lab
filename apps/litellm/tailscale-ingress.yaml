# Publishes the gateway (admin UI at /ui/, OpenAI-compatible API at /v1/*) on
# the tailnet as litellm.tail7f3c08.ts.net.
#
# The hostname comes from spec.tls[0].hosts[0] below; with no TLS host the
# operator would instead derive <namespace>-<ingress-name>-ingress from this
# object's name, which is why the Ingress is simply called litellm.
#
# Let's Encrypt caps certificate issuance per tailnet domain (50/week by
# default), so renaming several Ingresses in one change is fine - the old
# "five per week" note here was a misreading of the duplicate-certificate
# limit, which only applies to re-requesting the same name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: LiteLLM
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: sh-litellm
    gethomepage.dev/description: Model gateway, admin UI and OpenAI-compatible API
    gethomepage.dev/href: https://litellm.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - litellm.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: litellm
      port:
        number: 4000
