# The gateway's env: its own master key (what clients authenticate with), the
# OpenCode Go key behind the `fast` / `smart` aliases, and DATABASE_URL for the
# Postgres that holds spend logs. All three fields live on the `k3s/litellm`
# Vaultwarden item.
#
# The target Secret is templated so DATABASE_URL can be composed from the
# password rather than stored whole; engineVersion v2 means every key the
# gateway should see has to appear in the template, not only the composed one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: litellm-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        OPENCODE_GO_API_KEY: "{{ .OPENCODE_GO_API_KEY }}"
        DATABASE_URL: "postgresql://litellm:{{ .POSTGRES_PASSWORD }}@litellm-postgres:5432/litellm"
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: k3s/litellm
        property: LITELLM_MASTER_KEY
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: k3s/litellm
        property: OPENCODE_GO_API_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: k3s/litellm
        property: POSTGRES_PASSWORD
