# The gateway's env: its own master key (what clients authenticate with) and the
# OpenCode Go key behind the `fast` / `smart` aliases. Both fields live on the
# `k3s/litellm` Vaultwarden item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: litellm-env
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: k3s/litellm
        property: LITELLM_MASTER_KEY
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: k3s/litellm
        property: OPENCODE_GO_API_KEY
