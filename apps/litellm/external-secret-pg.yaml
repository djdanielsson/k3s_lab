# The postgres superuser password, generated into Vaultwarden by hand and
# consumed here. The gateway never sees this directly: it is composed into
# DATABASE_URL by external-secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pg
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: litellm-pg
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: k3s/litellm
        property: POSTGRES_PASSWORD
