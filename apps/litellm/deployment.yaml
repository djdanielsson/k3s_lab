# LiteLLM gateway. The model list is the ConfigMap, the credentials and
# DATABASE_URL are the `litellm-env` Secret. Postgres is where spend is
# recorded, not a dependency of serving: if `litellm-postgres` is down the
# gateway still answers completions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        # On first boot with a DATABASE_URL the gateway runs prisma migrations
        # and exits if postgres is not accepting yet, so a from-scratch deploy
        # costs a CrashLoop-restart cycle without this. Same reason as the
        # identical initContainer on the omnigent server.
        - name: wait-for-postgres
          image: docker.io/library/postgres:18-alpine
          command:
            - sh
            - -c
            - until pg_isready -h litellm-postgres -p 5432 -U litellm -d litellm; do echo waiting for postgres; sleep 2; done
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-env
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: litellm
