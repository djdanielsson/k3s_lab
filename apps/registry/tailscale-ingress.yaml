apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ts
  namespace: registry
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Registry
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: docker.png
    gethomepage.dev/description: Container image registry
    gethomepage.dev/href: https://registry.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - registry.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: registry
      port:
        number: 5000
