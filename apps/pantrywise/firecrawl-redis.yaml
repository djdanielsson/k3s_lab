apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-redis
  namespace: pantrywise
  labels:
    app: pantrywise-firecrawl-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pantrywise-firecrawl-redis
  template:
    metadata:
      labels:
        app: pantrywise-firecrawl-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["redis-server", "--bind", "0.0.0.0", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-redis
  namespace: pantrywise
  labels:
    app: pantrywise-firecrawl-redis
spec:
  type: ClusterIP
  selector:
    app: pantrywise-firecrawl-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
