apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pantrywise
  labels:
    app: pantrywise-web
  annotations:
    tailscale.com/manage: "true"
    tailscale.com/hostname: pantrywise
spec:
  type: ClusterIP
  selector:
    app: pantrywise-web
  ports:
    - name: http
      port: 80
      targetPort: 80
