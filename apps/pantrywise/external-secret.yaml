# Populates `pantrywise-secrets` from Vaultwarden (replaces sealed-secret).
# Item: `k3s/pantrywise-secrets`, one Custom Field per key (see SECRETS.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pantrywise-secrets
  namespace: pantrywise
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: pantrywise-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: k3s/pantrywise-secrets
        property: database-url
    - secretKey: jwt-secret
      remoteRef:
        key: k3s/pantrywise-secrets
        property: jwt-secret
    - secretKey: postgres-db
      remoteRef:
        key: k3s/pantrywise-secrets
        property: postgres-db
    - secretKey: postgres-user
      remoteRef:
        key: k3s/pantrywise-secrets
        property: postgres-user
    - secretKey: postgres-password
      remoteRef:
        key: k3s/pantrywise-secrets
        property: postgres-password
