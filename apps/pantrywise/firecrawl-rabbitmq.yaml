apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-rabbitmq
  namespace: pantrywise
  labels:
    app: pantrywise-firecrawl-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pantrywise-firecrawl-rabbitmq
  template:
    metadata:
      labels:
        app: pantrywise-firecrawl-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # Pinned to the running release: 3-management floats to whatever is
          # current, which turns an unrelated pod restart into an upgrade.
          image: docker.io/library/rabbitmq:3.13.7-management
          command: ["rabbitmq-server"]
          ports:
            - containerPort: 5672
              name: amqp
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # tmpfs below counts against this limit, so keep headroom above it.
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          # Firecrawl declares all four queues as x-queue-type=quorum, so every
          # publish is a fsynced Raft WAL append: that was ~13GB of disk writes
          # per day on a node whose single SSD is the bottleneck. The volume was
          # already an emptyDir, so nothing survives a pod restart today and
          # moving it to tmpfs costs no durability. sizeLimit bounds the RAM the
          # queues can pin; raise it together with the memory limit above.
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-rabbitmq
  namespace: pantrywise
  labels:
    app: pantrywise-firecrawl-rabbitmq
spec:
  type: ClusterIP
  selector:
    app: pantrywise-firecrawl-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
