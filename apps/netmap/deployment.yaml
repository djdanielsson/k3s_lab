# NetMap - nmap LAN scanner + web UI. hostNetwork so nmap reaches the LAN
# (works regardless of the pod-to-pod CNI issue). Runs as root for NET_RAW.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmap
  namespace: netmap
  labels:
    app: netmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netmap
  template:
    metadata:
      labels:
        app: netmap
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      containers:
        - name: netmap
          image: registry.registry.svc:5000/netmap:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SCAN_SUBNET
              value: 192.168.1.0/24
            - name: SCAN_INTERVAL
              value: "900"
            - name: DB_PATH
              value: /data/netmap.db
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netmap-data
