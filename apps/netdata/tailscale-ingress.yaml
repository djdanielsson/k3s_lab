apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netdata-ts
  namespace: netdata
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Netdata
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: netdata.png
    gethomepage.dev/description: Real-time node monitoring
    gethomepage.dev/href: https://netdata.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - netdata.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: netdata
      port:
        number: 19999
