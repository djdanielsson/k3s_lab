apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ts
  namespace: argocd
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: argo-cd.png
    gethomepage.dev/description: GitOps application health
    gethomepage.dev/href: https://argocd.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - argocd.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
