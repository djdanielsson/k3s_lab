# Tailscale Cluster-Ingress per app -> exposes each over the tailnet at <hostname>.<tailnet>.ts.net
# (handled by the installed Tailscale operator; hosts reachable from any tailnet device).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pantrywise-ts
  namespace: pantrywise
  annotations:
    tailscale.com/ingress: "true"
    tailscale.com/hostname: pantrywise
    tailscale.com/parent-group: k3s
spec:
  rules:
    - host: pantrywise
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
