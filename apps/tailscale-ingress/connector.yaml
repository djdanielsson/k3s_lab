# Tailscale Connector -> advertises LAN + k3s cluster subnets AND acts as an exit
# node on the tailnet via the Tailscale operator. Tagged tag:k3s.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: k3s
  namespace: tailscale
spec:
  tags:
    - tag:k3s
  hostnamePrefix: ts-k3s
  replicas: 1
  exitNode: true
  subnetRouter:
    advertiseRoutes:
      - "192.168.1.0/24"   # LAN
      - "10.42.0.0/16"     # pods
      - "10.43.0.0/16"     # services
