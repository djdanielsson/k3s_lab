apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ts
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Prometheus
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: prometheus.png
    gethomepage.dev/description: Metrics, alerts and queries
    gethomepage.dev/href: https://prometheus.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - prometheus.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: kube-prometheus-stack-prometheus
      port:
        number: 9090
