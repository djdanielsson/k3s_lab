apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar-ts
  namespace: radar
  labels:
    app.kubernetes.io/instance: tailscale-ingress
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Radar
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: mdi-radar
    gethomepage.dev/description: Kubernetes workload audit
    gethomepage.dev/href: https://radar.tail7f3c08.ts.net
spec:
  ingressClassName: tailscale
  # The operator takes the first label of spec.tls[0].hosts[0] as the
  # device name, which is what the MagicDNS record is built from.
  tls:
    - hosts:
        - radar.tail7f3c08.ts.net
  defaultBackend:
    service:
      name: radar
      port:
        number: 9280
