# The operator's OAuth client, sourced from Vaultwarden.
#
# The Tailscale Kubernetes operator mints an auth key per tailnet Ingress, and
# this client is the credential it does that with. It used to be a hand-applied
# Secret whose value lived nowhere else — not in Vaultwarden, and the repo only
# held the `kubectl create secret` recipe with placeholders. That is a bad shape
# for a credential with scope `all` on the tailnet: nothing to rotate from, and
# no way to tell whether the running copy is current.
#
# The item is `k3s/tailscale` (fields CLIENT_ID / CLIENT_SECRET). The operator
# chart mounts this Secret at /oauth/ and reads client_id / client_secret, hence
# the template's key mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "{{ .CLIENT_ID }}"
        client_secret: "{{ .CLIENT_SECRET }}"
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: k3s/tailscale
        property: CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: k3s/tailscale
        property: CLIENT_SECRET
