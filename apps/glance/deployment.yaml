# Glance - self-hosted homepage/dashboard. Stateless; config from a ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
  labels:
    app: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      automountServiceAccountToken: false
      containers:
        - name: glance
          # Pinned to the digest of the running build; Renovate bumps the digest.
          image: docker.io/glanceapp/glance:latest@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: GLANCE_CONFIG
              value: /app/config/glance.yml
          volumeMounts:
            - name: config
              # mount the ConfigMap as a dir; its 'glance.yml' key becomes
              # /app/config/glance.yml (subPath is unreliable here)
              mountPath: /app/config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: glance-config
