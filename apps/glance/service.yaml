# NodePort so the dashboard is reachable on the LAN at http://192.168.1.116:31080
apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: glance
  labels:
    app: glance
  annotations:
    tailscale.com/manage: "true"
    tailscale.com/hostname: glance
spec:
  type: NodePort
  selector:
    app: glance
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31080
