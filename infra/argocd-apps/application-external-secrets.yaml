apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # CRDs are Helm-managed (installCRDs=true) so controller/CRD versions
    # always move together on chart bumps (k3s 1.36 satisfies all minimums).
    targetRevision: 2.15.0
    helm:
      parameters:
        - name: installCRDs
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      # Pruning is ON. Note what it covers: the chart's installCRDs=true means
      # ArgoCD tracks ESO's CRDs themselves (25 in the resource tree), so a
      # future chart release that drops a CRD will prune it — and Kubernetes
      # deletes every custom resource of that kind with it. That is the
      # intended GitOps behaviour for a deliberate chart bump, but it is the
      # one prune in this repo that can remove data: check the CRD list in a
      # chart diff before merging an external-secrets bump.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
