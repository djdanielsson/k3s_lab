apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # CRDs are Helm-managed (installCRDs=true) so controller/CRD versions
    # always move together on chart bumps (k3s 1.36 satisfies all minimums).
    targetRevision: 2.11.0
    helm:
      parameters:
        - name: installCRDs
          value: "true"
      values: |
        # Radar's audit: resources are unset on all three components, and the
        # health server behind the readiness/liveness probes is off by default
        # (enabling readiness auto-starts --live-addr, which is what the chart's
        # probes target: named port "live", /healthz + /readyz).
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 256Mi}
        livenessProbe:
          enabled: true
        readinessProbe:
          enabled: true
        webhook:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 256Mi}
          livenessProbe:
            enabled: true
        certController:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 256Mi}
          livenessProbe:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
