apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Pin 0.14.x: 2.x CRDs need k8s>=1.30 (this is k3s 1.26); 0.14.x serves
    # v1beta1+v1 and has the webhook provider our Vaultwarden pattern uses.
    targetRevision: 0.14.2
    helm:
      parameters:
        - name: installCRDs
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
