apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # CRDs are Helm-managed (installCRDs=true) so controller/CRD versions
    # always move together on chart bumps (k3s 1.36 satisfies all minimums).
    targetRevision: 2.10.0
    helm:
      parameters:
        - name: installCRDs
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
