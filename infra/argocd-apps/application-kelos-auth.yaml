apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kelos-auth
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/djdanielsson/k3s_lab
    targetRevision: main
    path: apps/kelos-auth
  destination:
    server: https://kubernetes.default.svc
    namespace: kelos-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
