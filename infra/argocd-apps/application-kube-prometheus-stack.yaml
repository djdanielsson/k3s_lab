# kube-prometheus-stack — Prometheus + monitoring CRDs. Provides the metrics
# source for Radar (radar's traffic.prometheusUrl points here). Pinned to 58.x
# (broadly compatible with this cluster's k8s 1.26; 59+ targets newer k8s).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.7.2
    helm:
      values: |
        # Grafana + Alertmanager not required by Radar -> keep the footprint light.
        grafana:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true