apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netdata
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/djdanielsson/k3s_lab
    targetRevision: main
    path: apps/netdata
  destination:
    server: https://kubernetes.default.svc
    namespace: netdata
  ignoreDifferences:
    # hostNetwork DaemonSet: api-server-defaulted pod-level fields cause benign
    # drift. (Container-level defaults like imagePullPolicy are set explicitly
    # in the manifest instead of ignored.) Note: ArgoCD's diff normalizer does
    # not support '*' array traversal, so no jqPathExpressions with '[*]' here.
    - group: apps
      kind: DaemonSet
      jqPathExpressions:
        - .spec.template.spec.dnsPolicy
        - .spec.template.spec.restartPolicy
        - .spec.template.spec.schedulerName
        - .spec.template.spec.terminationGracePeriodSeconds
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
