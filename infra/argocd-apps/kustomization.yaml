apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - appproject.yaml
  - application-registry.yaml
  - application-pantrywise.yaml
  - application-rustfs.yaml
  - application-radar.yaml
  - application-radar-rbac.yaml
  - application-radar-auth.yaml
  - application-caretta.yaml
  - application-opencost.yaml
  - application-cert-manager.yaml
  - application-sealed-secrets.yaml
  - application-forgejo.yaml
  # netdata is disabled for now: its container OOMKilled on every start and the
  # restart loop re-read ~80MB/s from the node's only disk, which starved the
  # k3s datastore and every probe on that disk. Commented out here so the
  # app-of-apps stops reconciling it (the Application object is deleted too);
  # apps/netdata now asks for 2Gi, so re-enabling is uncommenting this line.
  # - application-netdata.yaml
  # netalertx is disabled for now: it churned ~4.7GB/day through a 42MB SQLite
  # file on the node's only disk, which is already the cluster's bottleneck.
  # The Application object is deleted too, so this stops the app-of-apps from
  # recreating it. The netalertx-data PVC is kept (Prune=false) so device
  # history survives a re-enable: uncommenting this line is all it takes.
  # - application-netalertx.yaml
  - application-cert-manager-issuers.yaml
  - application-ingress.yaml
  - application-dnsmasq.yaml
  - application-external-secrets.yaml
  - application-eso-bitwarden.yaml
  - application-tailscale-operator.yaml
  - application-tailscale-oauth.yaml
  - application-tailscale-ingress.yaml
  - application-hermes.yaml
  - application-admin-access.yaml
  - application-argocd-apps.yaml
  - application-kube-prometheus-stack.yaml
  - application-omnigent.yaml
  - application-vault.yaml
  - application-homepage.yaml
  - application-rustdesk.yaml
