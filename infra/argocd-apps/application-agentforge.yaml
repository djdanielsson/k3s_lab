# AgentForge control plane.
#
# The chart lives in the private djdanielsson/agentforge repository, which
# ArgoCD reaches through the `repo-agentforge` credential in the argocd
# namespace. Deliberately not vendored here, so the chart has one source of
# truth.
#
# There are no credentials in this file: this repository is public. The
# database Secret is created out of band and named by
# `postgres.auth.existingSecret`. It must contain `database-url` and
# `postgres-password` and must exist before the first sync.
#
# Images are built into the in-cluster registry by a Kaniko Job. The tag is the
# AgentForge commit they were built from, which makes a rollback a one-line
# change here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentforge
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/djdanielsson/agentforge
    targetRevision: main
    path: deploy/helm/agentforge
    helm:
      releaseName: agentforge
      values: |
        api:
          image:
            repository: registry.registry.svc:5000/agentforge-api
            tag: "6f832b3"
        orchestrator:
          image:
            repository: registry.registry.svc:5000/agentforge-orchestrator
            tag: "6f832b3"
        web:
          image:
            repository: registry.registry.svc:5000/agentforge-web
            tag: "6f832b3"

        # The chart does not own the database credentials; the
        # agentforge/agentforge-db Secret does.
        postgres:
          auth:
            existingSecret: agentforge-db

        config:
          environment: production
          workspaceProvider: kubernetes
          workspaceNamespacePrefix: af
          # The stock OpenHands image cannot run its agent in-pod: the local
          # runtime wants tmux and a browser. This is the image built from
          # deploy/images/openhands/ by the in-cluster Kaniko pipeline.
          workspaceAgentImage: registry.registry.svc:5000/agentforge-openhands:6f832b3
          # Patched to the tag below by the release process; the chart default is
          # the upstream image, which is only useful once the gaps are closed.
          workspaceAgentRuntime: local

        # The gateway is what turns an agent's `model` alias into a real call, so
        # it ships with the app: `local-coder` on the bundled Ollama, and `fast`
        # /`smart` through OpenCode Go, whose key this cluster already holds for
        # Hermes. See apps/agentforge/external-secret.yaml for the field names.
        llm:
          enabled: true
          ollama:
            enabled: true

        # The dashboard has no way to supply an API key yet, and nothing
        # exposes this API outside the cluster. Turn this on before adding an
        # Ingress.
        auth:
          enabled: false

        # Reachable on the tailnet at
        # https://agentforge-agentforge-ts-ingress.tail7f3c08.ts.net (the
        # operator derives the name from the namespace and the object name).
        # This is the only exposure: there is no LAN ingress and no public
        # route, so the tailnet ACLs are the boundary while auth stays off.
        tailscaleIngress:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: agentforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
