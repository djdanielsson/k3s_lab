apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/djdanielsson/k3s_lab
    targetRevision: main
    path: apps/hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  # PAUSED ON PURPOSE: Hermes is the agent runtime itself. Auto-sync stays off
  # so a GitOps mistake cannot restart the assistant mid-investigation. Re-enable
  # by restoring the `automated:` block once a change to this app has been
  # reviewed and Hermes is not the one applying it.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false