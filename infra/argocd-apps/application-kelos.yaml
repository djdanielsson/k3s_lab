apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kelos
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/kelos-dev/kelos
    targetRevision: v0.55.0
    path: internal/manifests/charts/kelos
    helm:
      values: |
        # First-time install: render CRDs so the controller can start its
        # Kelos resource watches (chart default is controller-only).
        crds:
          install: true
          keep: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kelos-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
