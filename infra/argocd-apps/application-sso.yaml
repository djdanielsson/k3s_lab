apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/djdanielsson/k3s_lab.git
    targetRevision: main
    path: apps/sso
  destination:
    server: https://kubernetes.default.svc
    namespace: sso
  ignoreDifferences:
  - group: ''
    kind: Secret
    name: sso-oidc
    jsonPointers:
    - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
