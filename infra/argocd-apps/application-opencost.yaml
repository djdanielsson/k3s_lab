apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    targetRevision: 2.5.32
    helm:
      values: |
        # Use the in-cluster kube-prometheus-stack Prometheus instead of
        # deploying OpenCost's bundled one; cost metrics land in the same
        # store Radar already reads.
        opencost:
          prometheus:
            internal:
              enabled: false
            external:
              enabled: true
              url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          # Let kube-prometheus-stack scrape OpenCost's cost/exporter metrics.
          metrics:
            serviceMonitor:
              enabled: true
              scrapeInterval: 1m
              # kube-prometheus-stack only selects monitors labeled
              # release=kube-prometheus-stack.
              additionalLabels:
                release: kube-prometheus-stack
          # Radar's audit: neither container sets allowPrivilegeEscalation and
          # the chart only ships a memory limit. The main container's values
          # live under `exporter` (rendered container name: opencost).
          exporter:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests: {cpu: 10m, memory: 55Mi}
              limits: {cpu: 500m, memory: 1Gi}
        ui:
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 10m, memory: 55Mi}
            limits: {cpu: 200m, memory: 1Gi}
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
