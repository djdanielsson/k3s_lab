# Cluster wiring for AgentForge that the chart must not own: the Secret the
# model gateway reads its keys from, synced out of Vaultwarden exactly like
# every other app's credentials.
#
# The bulk of AgentForge lives in its own Application (`agentforge`), which
# tracks the private application repository and its Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentforge-secrets
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/djdanielsson/k3s_lab
    targetRevision: main
    path: apps/agentforge
  destination:
    server: https://kubernetes.default.svc
    namespace: agentforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
