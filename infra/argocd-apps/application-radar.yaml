apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://skyhook-io.github.io/helm-charts
    chart: radar
    targetRevision: 1.12.2
    helm:
      values: |
        # Metrics source -> kube-prometheus-stack's Prometheus (monitoring ns).
        traffic:
          prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        # Helm write ops (install/upgrade/rollback) + secrets read for
        # release storage.
        rbac:
          helm: true
        # ArgoCD panel: token stored as SealedSecret (radar-auth app).
        argocd:
          existingSecret: radar-argocd-token
          existingSecretKey: token
          url: http://argocd-server.argocd.svc:80
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
