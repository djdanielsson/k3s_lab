apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://skyhook-io.github.io/helm-charts
    chart: radar
    targetRevision: 1.21.0
    helm:
      values: |
        # Native OIDC; group claims map to Kubernetes RBAC in apps/sso/rbac.yaml.
        auth:
          mode: oidc
          existingSecret: sso-oidc
          existingSecretKey: auth-secret
          oidc:
            issuerURL: https://sso.tail7f3c08.ts.net/realms/lab
            clientID: radar
            existingSecret: sso-oidc
            clientSecretKey: client-secret
            redirectURL: https://radar.tail7f3c08.ts.net/auth/callback
            usernameClaim: preferred_username
            groupsClaim: groups
            scopes: [openid, profile, email]
            enablePKCE: true
        allowedHosts:
          - radar.tail7f3c08.ts.net
        # Traffic source -> Caretta's own VictoriaMetrics store (caretta-vm),
        # which holds the eBPF flow metrics (kube-prometheus has none).
        traffic:
          prometheusUrl: http://caretta-vm.caretta.svc:8428
        # Helm write ops (install/upgrade/rollback) + secrets read for
        # release storage.
        rbac:
          helm: true
        # ArgoCD panel: token stored as SealedSecret (radar-auth app).
        argocd:
          existingSecret: radar-argocd-token
          existingSecretKey: token
          url: http://argocd-server.argocd.svc:80
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
