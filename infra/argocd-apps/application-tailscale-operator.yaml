# Tailscale operator — from a GIT source (its Helm chart lives in tailscale/tailscale,
# NOT a hosted chart repo; that's why we use repoURL=github here instead of a chart repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: k3s-lab
  source:
    repoURL: https://github.com/tailscale/tailscale
    targetRevision: v1.102.4
    path: cmd/k8s-operator/deploy/chart
    helm:
      values: |
        operator:
          image:
            tag: v1.102.4
            pullPolicy: IfNotPresent
        operatorConfig:
          defaultTags:
            - tag:k3s
          # Radar's audit: no resource block on the operator container, and it
          # allows privilege escalation.
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
        proxyConfig:
          defaultTags: tag:k3s
          # Every ts-* proxy StatefulSet inherits this ProxyClass: resources
          # limits and allowPrivilegeEscalation=false. Probes, SA-token
          # automount and read-only rootfs are not expressible in a ProxyClass.
          defaultProxyClass: tailscale-proxy-hardened
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
