apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  # Official ArgoCD manifests for this install. Pinned for reproducibility.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml
  # ingressroute.yaml NOT included: Traefik is removed/disabled and its CRDs
  # are gone; the ArgoCD UI is served via the Tailscale ingress instead
  # (apps/tailscale-ingress/argocd-server-ts-ingress.yaml).

# Merge server.insecure=true into ArgoCD's built-in cmd-params ConfigMap so the
# UI/API are served over HTTP through the Tailscale Ingress above.
configMapGenerator:
  - name: argocd-cmd-params-cm
    behavior: merge
    literals:
      - server.insecure="true"
  # Local API account for Radar's ArgoCD panel (token minted via API,
  # stored as SealedSecret in apps/radar-auth).
  - name: argocd-cm
    behavior: merge
    literals:
      - accounts.radar="apiKey"
  # Radar gets full ArgoCD access so in-cluster actions (sync, etc.) work.
  # Tailnet-only exposure; downgrade to `role:readonly` here if preferred.
  - name: argocd-rbac-cm
    behavior: merge
    literals:
      - policy.csv="g, radar, role:admin"

# Radar's audit flags every ArgoCD component for missing resources and, on
# four of them, missing probes. The upstream install manifests are the source
# of truth here, so these are the smallest patches that add what it ships
# without (same pattern as the ConfigMap merges above).
patches:
  - target: {kind: Deployment, name: argocd-server}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {cpu: 500m, memory: 512Mi}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {cpu: 1000m, memory: 1Gi}
  - target: {kind: Deployment, name: argocd-applicationset-controller}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-applicationset-controller
                # Upstream ships no probes; TCP on the webhook port is the
                # strongest check available (7000 serves no /healthz).
                readinessProbe:
                  tcpSocket: {port: 7000}
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  tcpSocket: {port: 7000}
                  initialDelaySeconds: 20
                  periodSeconds: 30
                resources:
                  requests: {cpu: 50m, memory: 128Mi}
                  limits: {cpu: 500m, memory: 512Mi}
  - target: {kind: Deployment, name: argocd-notifications-controller}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-notifications-controller
                # liveness already exists on 9001; readiness is the gap.
                readinessProbe:
                  tcpSocket: {port: 9001}
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 200m, memory: 256Mi}
  - target: {kind: Deployment, name: argocd-dex-server}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        template:
          spec:
            containers:
              - name: dex
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 200m, memory: 256Mi}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: {cpu: 50m, memory: 64Mi}
                  limits: {cpu: 200m, memory: 256Mi}
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                livenessProbe:
                  tcpSocket: {port: 8082}
                  initialDelaySeconds: 30
                  periodSeconds: 30
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {cpu: 1000m, memory: 1Gi}
