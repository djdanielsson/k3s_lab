---
# Traefik IngressRoute exposing the ArgoCD UI + gRPC.
# Served at http://argocd.k3s.lab.danielsson.us.com (entrypoint: web / HTTP).
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    # gRPC (used by the ArgoCD CLI / web terminal)
    - kind: Rule
      match: Host(`argocd.k3s.lab.danielsson.us.com`) && Headers(`Content-Type`, `application/grpc`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    # HTTP UI
    - kind: Rule
      match: Host(`argocd.k3s.lab.danielsson.us.com`)
      priority: 1
      services:
        - name: argocd-server
          port: 80
